<body>
    <div class="container">

        </div>

<script>
let stockData = {};

// ========== 腾讯K线API ==========
async function fetchKlines(code) {
    const tcode = code.startsWith('6') ? `sh${code}` : `sz${code}`;
    const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${tcode},day,,,120,qfq`;
    const res = await fetch(url);
    const json = await res.json();

    const data = json.data && json.data[tcode];
    if (!data) throw new Error('无法获取K线数据');

    const klines = data.qfqday || data.day;
    if (!klines || klines.length === 0) throw new Error('K线数据为空');

    return klines.map(d => ({
        date: d[0].replace(/-/g, ''),
        open: +d[1],
        close: +d[2],
        low: +d[3],
        high: +d[4],
    }));
}

async function fetchBenchKlines() {
    const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=sh000300,day,,,120,qfq`;
    const res = await fetch(url);
    const json = await res.json();

    const data = json.data && json.data['sh000300'];
    const klines = data && (data.qfqday || data.day);
    if (!klines) throw new Error('无法获取沪深300数据');

    return klines.map(d => ({
        date: d[0].replace(/-/g, ''),
        close: +d[2],
    }));
}

async function fetchStockInfo(code) {
    const tcode = code.startsWith('6') ? `sh${code}` : `sz${code}`;
    const res = await fetch(`https://qt.gtimg.cn/q=${tcode}`);
    // 腾讯API返回GBK编码，需要手动解码
    const buffer = await res.arrayBuffer();
    const decoder = new TextDecoder('gbk');
    const text = decoder.decode(buffer);
    const m = text.match(/v_[^=]+="([^"]+)"/);
    if (!m) return { name: code, cap: null };

    const parts = m[1].split('~');
    return {
        name: parts[1] || code,
        cap: parts[44] ? parseFloat(parts[44]) : null,  // 腾讯API返回的市值已经是亿元
    };
}

async function fetchData() {
    const code = document.getElementById('code').value.trim();
    if (!/^\d{6}$/.test(code)) {
        showError('请输入6位数字的股票代码');
        return;
    }

    document.getElementById('fetchBtn').disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').innerHTML = '';

    try {
        const [klines, benchKlines, info] = await Promise.all([
            fetchKlines(code),
            fetchBenchKlines(),
            fetchStockInfo(code),
        ]);

        if (klines.length < 45) throw new Error('K线数据不足45天');

        const stockMap = new Map(klines.map(d => [d.date, d]));
        const benchMap = new Map(benchKlines.map(d => [d.date, d]));
        const dates = klines.map(d => d.date).filter(d => benchMap.has(d));
        dates.sort();

        const stockAligned = dates.map(d => stockMap.get(d));
        const benchAligned = dates.map(d => benchMap.get(d));
        const closes = stockAligned.map(d => d.close);
        const benchCloses = benchAligned.map(d => d.close);

        const ret45 = closes.length >= 46
            ? (closes[closes.length - 1] - closes[closes.length - 46]) / closes[closes.length - 46] * 100
            : (closes[closes.length - 1] - closes[0]) / closes[0] * 100;

        const high120 = Math.max(...closes);
        const low120 = Math.min(...closes);
        const pos = high120 > low120 ? (closes[closes.length - 1] - low120) / (high120 - low120) : 0.5;

        const stockR = [], benchR = [];
        for (let i = 1; i < stockAligned.length; i++) {
            stockR.push((closes[i] - closes[i-1]) / closes[i-1]);
            benchR.push((benchCloses[i] - benchCloses[i-1]) / benchCloses[i-1]);
        }
        const beta = calcBeta(stockR, benchR);
        const alpha = calcAlpha(stockR, benchR, beta);
        const idioVol = calcIdioVol(stockR, benchR, beta); // 真正个股波动率（残差标准差）

        const indInfo = getIndustryInfo(info.name);
        stockData = { code, name: info.name, ret45, pos, beta, alpha, idioVol, cap: info.cap, indInfo };

        document.getElementById('beta').value = beta.toFixed(2);
        document.getElementById('alpha').value = alpha.toFixed(4);
        document.getElementById('ret45').value = ret45.toFixed(2);
        document.getElementById('pos').value = pos.toFixed(4);

        const capStr = info.cap ? `${info.cap.toFixed(0)}亿` : 'N/A';
        document.getElementById('marketInfo').innerHTML =
            `📈 ${info.name} (${code}) | α=${(alpha*100).toFixed(1)}% | β=${beta.toFixed(2)} | 45日=${ret45.toFixed(1)}% | 位置=${(pos*100).toFixed(0)}% | 市值=${capStr} | 波动=${(idioVol*100).toFixed(1)}% | 行业=${indInfo.label}`;
        document.getElementById('marketInfo').style.display = 'block';

        document.getElementById('manualInputs').style.display = 'grid';
        document.getElementById('scoreBtn').style.display = 'block';

    } catch (e) {
        showError('获取数据失败: ' + e.message);
    } finally {
        document.getElementById('fetchBtn').disabled = false;
        document.getElementById('loading').style.display = 'none';
    }
}

function calcBeta(sr, br) {
    const n = sr.length;
    if (n < 2) return 1;
    const ms = sr.reduce((a,b) => a+b, 0) / n;
    const mb = br.reduce((a,b) => a+b, 0) / n;
    let cov = 0, vr = 0;
    for (let i = 0; i < n; i++) {
        cov += (sr[i] - ms) * (br[i] - mb);
        vr += (br[i] - mb) ** 2;
    }
    return vr > 0 ? (cov/n) / (vr/n) : 1;
}

function calcAlpha(sr, br, beta) {
    const n = sr.length;
    if (n < 2) return 0;
    const ms = sr.reduce((a,b) => a+b, 0) / n;
    const mb = br.reduce((a,b) => a+b, 0) / n;
    return (ms - beta * mb) * 252;
}

// 计算个股波动率（残差标准差，年化）- 真正衡量个股特有波动
function calcIdioVol(sr, br, beta) {
    const n = sr.length;
    if (n < 2) return 0;
    // 残差收益率 = 个股收益 - Beta × 市场收益
    const residuals = [];
    for (let i = 0; i < n; i++) {
        residuals.push(sr[i] - beta * br[i]);
    }
    const m = residuals.reduce((a,b) => a+b, 0) / n;
    const variance = residuals.reduce((sum, r) => sum + (r - m) ** 2, 0) / n;
    return Math.sqrt(variance) * Math.sqrt(252); // 年化
}

// ========== V6.0 平滑评分 ==========
function smoothScore(value, thresholds, scores) {
    if (value <= thresholds[0]) return scores[0];
    if (value >= thresholds[thresholds.length - 1]) return scores[scores.length - 1];
    for (let i = 0; i < thresholds.length - 1; i++) {
        if (thresholds[i] <= value && value <= thresholds[i + 1]) {
            const t = (value - thresholds[i]) / (thresholds[i + 1] - thresholds[i]);
            return scores[i] + t * (scores[i + 1] - scores[i]);
        }
    }
    return scores[scores.length - 1];
}

// ========== 行业映射 + Beta权重 ==========
function getIndustryInfo(name) {
    const patterns = {
        "半导体|芯片|集成|微装|澜起|兆易|纳芯|豪威|国民|芯基|芯碁|峰岹": { label: "半导体", weight: 1.3, base: 5 },
        "新能源|光伏|储能|宁德|钧达|大金重工|天岳|先导": { label: "新能源", weight: 1.2, base: 4 },
        "软件|通信|科技|剑桥|广和通|美格智能|龙旗|华勤|立讯|蓝思|三一|大族": { label: "科技制造", weight: 1.2, base: 4 },
        "机器人|精密|制造|埃斯顿|兆威|三环|鼎泰|广合|胜宏|牧原": { label: "制造", weight: 1.1, base: 4 },
        "医药|医疗|生物|恒瑞|可孚|迈威": { label: "医药", weight: 1.0, base: 4 },
        "新材料|军工|国恩|沃尔|吉宏|赤峰": { label: "新材料军工", weight: 1.0, base: 3 },
        "饮料|食品|消费|安井|东鹏|海天": { label: "消费", weight: 0.8, base: 2 },
        "银行|保险|地产|期货": { label: "金融地产", weight: 0.7, base: 1 },
        "化工|钢铁|纺织|滨化": { label: "周期", weight: 0.7, base: 1 },
    };
    for (const [p, info] of Object.entries(patterns)) {
        if (p.split("|").some(k => name.includes(k))) return info;
    }
    return { label: "其他", weight: 1.0, base: 2 };
}

function doScore() {
    if (!stockData.code) { showError('请先获取数据'); return; }

    // 输入校验
    const disc = parseFloat(document.getElementById('discount').value);
    const cs = parseFloat(document.getElementById('cs').value);
    const sp = parseFloat(document.getElementById('sp').value);
    if (isNaN(disc) || disc < 0 || disc > 100) { showError('AH折价率必须在 0-100% 之间'); return; }
    if (isNaN(cs) || cs < 0 || cs > 100) { showError('基石占比必须在 0-100% 之间'); return; }

    const r = stockData.ret45, b = stockData.beta, p = stockData.pos;
    const a = stockData.alpha;       // 年化小数
    const cap = stockData.cap || 0;

    // 行业选择
    const indSelect = document.getElementById('ind');
    const opt = indSelect.options[indSelect.selectedIndex];
    const manualWeight = parseFloat(opt.dataset.weight) || 1.0;
    const manualLabel = opt.dataset.label || "其他";
    const autoInfo = stockData.indInfo || { label: "其他", weight: 1.0, base: 2 };
    const indChanged = indSelect.selectedIndex !== 0;
    const effectiveLabel = indChanged ? manualLabel : autoInfo.label;

    // === V6.3 逻辑回归模型 - 预测首日破发概率 (基于50只历史IPO) ===
    // 特征标准化参数
    const MEANS = [-2.707, 1.309, 40.237, 0.476, 0.332, 36.522, 1180.193, 0.230, 0.500, -1.083, -2.960];
    const STDS = [8.489, 0.648, 10.433, 0.303, 0.933, 12.241, 2423.357, 0.197, 1.000, 3.529, 14.228];
    const COEF = [-0.817, -0.162, -1.170, -0.714, 1.303, -0.701, -0.039, 1.315, 0.000, -0.022, 0.552];
    const INTERCEPT = -1.677;
    // Platt校准参数
    const PLATT_W = 1.840, PLATT_B = -1.506, PLATT_MEAN = 0.260, PLATT_STD = 0.281;

    // 行业编码（目标编码：历史破发率）
    const industryEncoded = autoInfo.base === 5 ? 0.143 :  // 半导体
                           autoInfo.base === 4 ? 0.200 :  // 新能源/科技/制造/医药
                           autoInfo.base === 3 ? 0.250 :  // 新材料军工
                           autoInfo.base === 2 ? 0.320 :  // 消费
                           0.320; // 金融地产/周期/其他

    // 保荐人编码
    const spEncoded = sp === 3 ? 0.6 : sp === 2 ? 0.5 : sp === 1.5 ? 0.45 : sp === 1 ? 0.4 : 0.35;

    // 交互项
    const ret45_x_disc = r * disc / 100;
    const beta_x_ret45 = b * r;

    // 特征向量
    const features = [r, b, cs, p, a, disc, cap, industryEncoded, spEncoded, ret45_x_disc, beta_x_ret45];

    // 标准化
    const xStd = features.map((v, i) => (v - MEANS[i]) / STDS[i]);

    // 逻辑回归计算原始概率
    let z = INTERCEPT;
    for (let i = 0; i < COEF.length; i++) z += COEF[i] * xStd[i];
    const rawProb = 1 / (1 + Math.exp(-Math.max(-500, Math.min(500, z))));

    // Platt校准
    const plattX = (rawProb - PLATT_MEAN) / PLATT_STD;
    const calibratedProb = 1 / (1 + Math.exp(-Math.max(-500, Math.min(500, PLATT_W * plattX + PLATT_B))));

    // 确保概率在合理范围
    const probBroken = Math.max(0.01, Math.min(0.99, calibratedProb));
    const score = 100 * (1 - probBroken);

    // 等级划分
    let grade, advice, boxClass, riskNote;
    if (score >= 80) { grade = 'A'; advice = '预测破发风险较低'; boxClass = 'grade-a'; riskNote = '历史相似样本破发率约<10%，但仍需独立判断'; }
    else if (score >= 60) { grade = 'B+'; advice = '预测破发风险中等偏低'; boxClass = 'grade-bp'; riskNote = '历史相似样本破发率约10-20%'; }
    else if (score >= 45) { grade = 'B'; advice = '预测破发风险中等'; boxClass = 'grade-b'; riskNote = '历史相似样本破发率约20-35%'; }
    else if (score >= 35) { grade = 'C'; advice = '预测破发风险中等偏高'; boxClass = 'grade-c'; riskNote = '历史相似样本破发率约35-50%'; }
    else { grade = 'D'; advice = '预测破发风险较高'; boxClass = 'grade-d'; riskNote = '历史相似样本破发率≥50%，建议谨慎'; }

    // 因子方向解释
    const factorEffects = [
        { name: 'A股45日涨幅', value: r, direction: r > 0 ? '↓降低破发概率' : '↑增加破发概率', detail: `${r.toFixed(1)}%` },
        { name: 'Beta', value: b, direction: b > 1.5 ? '↓高Beta在涨市中利好' : '↑低Beta相对稳健', detail: `β=${b.toFixed(2)}` },
        { name: '基石占比', value: cs, direction: cs > 40 ? '↓高基石占比降低破发概率' : '↑基石占比偏低', detail: `${cs.toFixed(1)}%` },
        { name: 'AH折价率', value: disc, direction: disc > 40 ? '↓高折价降低破发概率' : '↑折价率偏低', detail: `${disc.toFixed(1)}%` },
        { name: '市值', value: cap, direction: cap > 1000 ? '↓大市值降低破发概率' : '↑小市值风险较高', detail: `${cap.toFixed(0)}亿` },
        { name: 'Alpha方向', value: a, direction: a > 0 ? '↓正Alpha降低破发概率' : '↑负Alpha增加风险', detail: `${(a*100).toFixed(1)}%` },
        { name: '行业', value: autoInfo.base, direction: autoInfo.base >= 4 ? '↓科技行业 historically 表现较好' : '↑传统行业破发率较高', detail: effectiveLabel },
    ];

    // 找出正面和负面因子
    const goodFactors = factorEffects.filter(f => f.direction.startsWith('↓')).slice(0, 3);
    const badFactors = factorEffects.filter(f => f.direction.startsWith('↑')).slice(0, 3);

    document.getElementById('resName').textContent = `${stockData.name} (${stockData.code})`;
    document.getElementById('resScore').textContent = score.toFixed(0);
    document.getElementById('resGrade').textContent = `等级 ${grade}`;
    document.getElementById('resAdvice').textContent = advice;
    document.getElementById('scoreBox').className = 'score-box ' + boxClass;

    let html = `
        <tr style="background:#f0f7ff"><td colspan="4" style="padding:16px;text-align:center">
            <div style="font-size:14px;color:#555;margin-bottom:8px">📊 预测首日破发概率</div>
            <div style="font-size:48px;font-weight:800;color:${probBroken < 0.2 ? '#00c853' : probBroken < 0.35 ? '#ffab00' : '#dd2c00'}">${(probBroken*100).toFixed(1)}%</div>
            <div style="font-size:13px;color:#888;margin-top:4px">评分 ${score.toFixed(0)} / 100</div>
        </td></tr>
    `;

    html += goodFactors.map(f => `
        <tr><td style="color:#00c853">✅ ${f.name}</td><td colspan="3" style="font-size:13px;color:#666">${f.detail} - ${f.direction.substring(1)}</td></tr>
    `).join('');

    html += badFactors.map(f => `
        <tr><td style="color:#dd2c00">⚠️ ${f.name}</td><td colspan="3" style="font-size:13px;color:#666">${f.detail} - ${f.direction.substring(1)}</td></tr>
    `).join('');

    html += `<tr style="background:#f8f9fa"><td colspan="4" style="padding:12px;font-size:12px;color:#888">
        <div style="color:#c62828;font-size:11px;margin-bottom:4px">⚠️ ${riskNote}</div>
        <div>模型基于50只历史AH股IPO训练 | 本评分仅供研究参考，不构成投资建议</div>
        <div style="margin-top:4px">数据时点: ${new Date().toLocaleDateString('zh-CN')} | 行情数据: 腾讯财经</div>
    </td></tr>`;

    document.getElementById('factorsBody').innerHTML = html;
    document.getElementById('result').style.display = 'block';
}

function showError(msg) {
    document.getElementById('error').innerHTML = `<div class="error">${msg}</div>`;
}
</script>
</body>
</html>
